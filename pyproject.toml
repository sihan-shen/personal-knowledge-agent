[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-knowledge-agent"
version = "0.1.0"
description = "A personal knowledge management system built with RAG and Agent patterns."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
pka = "personal_knowledge_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
